<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador do Site Generativo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: o mesmo esqueleto do app do grupo (TelemetryOS) — menu lateral, cabeçalho com trilha, conteúdo em cartões brancos.
   Visual claro de propósito, igual ao app; por isso um tema só, com todas as cores declaradas. */
:root {
  --bg: #fafafa; --card: #ffffff; --ink: #0a0a0a; --muted: #52525b; --line: #e5e7eb; --soft: #f4f4f5;
  --dark: #18181b; --on-dark: #ffffff; --blue: #2563eb; --blue-soft: #dbeafe; --blue-ink: #1e40af;
  --green: #166534; --green-bg: #f0fdf4; --green-line: #bbf7d0; --amber: #854d0e; --amber-bg: #fef9c3;
  --orange: #9a3412; --orange-bg: #fff7ed; --orange-line: #fed7aa; --red: #b91c1c; --red-bg: #fef2f2; --red-line: #fecaca;
  --l1: #93c5fd; --l2: #2563eb; --l3: #ea580c;
  --f-body: Inter, "Segoe UI", Arial, sans-serif; --f-mono: "JetBrains Mono", Consolas, monospace;
  color-scheme: light;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
.app { display: flex; flex-wrap: wrap; min-height: 100%; }
.side { flex: 1 1 240px; max-width: 260px; box-sizing: border-box; padding-block: 16px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; }
@media (max-width: 760px) { .side { max-width: none; border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(12px, env(safe-area-inset-right, 0px)); } }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px; }
.logo { width: 32px; height: 32px; border-radius: 8px; background: var(--dark); display: flex; align-items: center; justify-content: center; }
.navgrp { display: flex; flex-direction: column; gap: 2px; }
.navgrp > span { font-size: 12px; color: var(--muted); padding: 4px 8px; }
.nav { border: 0; background: none; text-align: left; padding: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.nav:hover { background: var(--soft); }
.nav[aria-current="page"] { background: #f0f0f1; font-weight: 600; }
.nav.off { color: #a1a1aa; cursor: default; }
.nav.off:hover { background: none; }
.tag { font-size: 11px; font-weight: 600; border-radius: 99px; padding: 1px 8px; }
.tag.new { color: var(--blue-ink); background: var(--blue-soft); }
.viewer { margin-top: auto; border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--card); }
.viewer label { font-size: 12px; color: var(--muted); }
.viewer select { border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; background: var(--card); min-height: 38px; }
.main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding-block: 12px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--card); }
.crumb { display: flex; flex-direction: column; }
.crumb small { font-size: 11px; letter-spacing: .18em; color: var(--muted); }
.crumb b { font-weight: 600; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; background: var(--card); color: #3f3f46; }
.badge.live { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }
.content { padding-block: 24px 48px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; max-width: 1240px; width: 100%; box-sizing: border-box; }
@media (max-width: 760px) { .content, .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.title h1 { font-size: 26px; font-weight: 700; }
.title p { color: var(--muted); margin-top: 4px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.box-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.box-head h2 { font-size: 16px; font-weight: 600; }
.box-head p { color: var(--muted); font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 14px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi .l { color: var(--muted); font-size: 13px; }
.kpi .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; overflow-wrap: anywhere; }
.kpi .s { color: var(--muted); font-size: 12px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }
@media (max-width: 520px) { .charts { grid-template-columns: 1fr; } }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #3f3f46; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.hrow { display: grid; grid-template-columns: minmax(110px, 170px) 1fr 70px; gap: 10px; align-items: center; font-size: 13px; }
.htrack { height: 12px; background: var(--soft); border-radius: 4px; }
.htrack div { height: 12px; border-radius: 4px; }
.hrow .n { text-align: right; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.tile-top b { font-size: 13.5px; font-weight: 600; }
.tile .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .s { font-size: 12.5px; color: var(--muted); }
.pill { font-size: 11px; font-weight: 600; border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
.pill.ok { color: var(--green); background: var(--green-bg); }
.pill.prem { color: var(--amber); background: var(--amber-bg); }
.pill.novo { color: var(--red); background: var(--red-bg); }
details { border-top: 1px solid var(--soft); padding-top: 6px; }
summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--blue); }
.how { display: grid; gap: 6px; margin-top: 8px; font-size: 13px; }
.how div { display: grid; gap: 1px; }
.how span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.how code { font-family: var(--f-mono); font-size: 12px; background: var(--soft); border-radius: 6px; padding: 5px 7px; display: block; white-space: normal; }
.empty { border: 1px dashed #d4d4d8; border-radius: 12px; padding: 28px; text-align: center; color: var(--muted); background: var(--card); }
.two { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .two { grid-template-columns: 1fr; } }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { margin-left: 16px; padding-left: 12px; border-left: 2px solid var(--line); }
.tree li { margin: 6px 0; }
.node { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 12px; display: flex; flex-direction: column; gap: 1px; }
.node[aria-current="true"] { border-color: var(--dark); box-shadow: 0 0 0 1px var(--dark); }
.node b { font-weight: 600; }
.node span { font-size: 12px; color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 14px; font-weight: 500; min-height: 38px; }
.btn.primary { background: var(--dark); border-color: var(--dark); color: var(--on-dark); font-weight: 600; }
.btn.danger { color: var(--red); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
form { display: flex; flex-direction: column; gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; }
label.f input, label.f select { font-weight: 400; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--card); min-height: 38px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 10px; margin: 0; }
legend { font-weight: 600; padding: 0 4px; }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 3px 0; }
.chk input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--dark); }
.chk.all { font-weight: 600; border-bottom: 1px dashed var(--line); padding-bottom: 6px; margin-bottom: 4px; }
.hint { font-size: 12.5px; color: var(--muted); }
.err { color: var(--red); font-size: 13px; font-weight: 600; }
.warn { background: var(--orange-bg); border: 1px solid var(--orange-line); color: var(--orange); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.alerts { background: var(--red-bg); border: 1px solid var(--red-line); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; color: #7f1d1d; font-size: 13px; }
.alerts b.t { color: #991b1b; font-size: 14px; }
.chat { display: flex; flex-direction: column; gap: 12px; min-height: 260px; }
.msg { max-width: 85%; border-radius: 12px; padding: 10px 14px; line-height: 1.5; }
.msg.user { align-self: flex-end; background: var(--dark); color: var(--on-dark); border-bottom-right-radius: 2px; }
.msg.bot { align-self: flex-start; background: var(--soft); border-bottom-left-radius: 2px; display: flex; flex-direction: column; gap: 6px; }
.msg.bot.denied { background: var(--orange-bg); border: 1px solid var(--orange-line); }
.src { display: flex; flex-wrap: wrap; gap: 6px; }
.src span { font-size: 11.5px; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 1px 8px; color: #3f3f46; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 13px; min-height: 34px; }
.chip:hover { border-color: var(--dark); }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1 1 auto; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 40px; background: var(--card); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--dark); color: var(--on-dark); border-radius: 10px; padding: 10px 14px; max-width: min(440px, calc(100vw - 32px)); font-size: 13.5px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }

/* Cargos e membros: mesma estrutura das configurações de cargos do Discord, no visual claro do site */
.dc { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 520px; }
@media (max-width: 860px) { .dc { grid-template-columns: 1fr; } }
.dc-side { background: #fafafa; border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
@media (max-width: 860px) { .dc-side { border-right: 0; border-bottom: 1px solid var(--line); } }
.dc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 6px 8px; font-weight: 600; }
.dc-role { border: 1px solid transparent; background: none; color: var(--ink); display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-align: left; width: 100%; min-height: 40px; }
.dc-role:hover { background: var(--soft); }
.dc-role[aria-current="true"] { background: var(--card); border-color: var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.06); font-weight: 600; }
.dc-role > i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.dc-role .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dc-role .ct { display: flex; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 400; }
.dc-role .lk, .dc-perm .lk { color: #a1a1aa; display: flex; }
.dc-main { display: flex; flex-direction: column; min-width: 0; }
.dc-title { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 18px 20px 10px; }
.dc-title h2 { font-size: 18px; font-weight: 700; }
.dc-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.dc-btn { border: 1px solid var(--dark); background: var(--dark); color: #fff; border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: 13px; min-height: 36px; }
.dc-btn.ghost { background: var(--card); color: var(--ink); border-color: var(--line); font-weight: 500; }
.dc-btn.green { background: #16a34a; border-color: #16a34a; }
.dc-btn.danger { background: var(--card); color: var(--red); border-color: var(--red-line); }
.dc-btn[disabled] { opacity: .4; cursor: not-allowed; }
.dc-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.dc-tab { border: 0; background: none; color: var(--muted); padding: 10px 12px; border-bottom: 2px solid transparent; font-weight: 500; }
.dc-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.dc-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
.dc-grp { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 10px; }
.dc-perm { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.dc-perm.off { background: #fafafa; }
.dc-perm.off b { color: var(--muted); }
.dc-perm-top { display: flex; align-items: center; gap: 10px; }
.dc-perm-top b { flex: 1 1 auto; font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dc-perm p, .dc-hint { color: var(--muted); font-size: 13px; margin: 0; }
.dc-perm details { border-top: 0; padding-top: 0; }
.dc .how code { background: var(--soft); color: var(--ink); }
.hash { color: var(--muted); font-size: 16px; }
.sw { width: 42px; height: 24px; border-radius: 99px; border: 0; background: #d4d4d8; position: relative; flex: none; padding: 0; }
.sw span { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.sw[aria-checked="true"] { background: #16a34a; }
.sw[aria-checked="true"] span { left: 21px; }
.sw[disabled] { opacity: .4; cursor: not-allowed; }
.dc-search, .dc-f input, .dc-add select, .dc-add input { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 38px; }
.dc-f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
.dc-f input[disabled] { background: #fafafa; color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 36px; height: 36px; border-radius: 8px; border: 2px solid transparent; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
.dc-lock { display: flex; gap: 8px; align-items: center; background: var(--soft); color: var(--muted); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin: 0; }
.dc-save { position: sticky; bottom: 16px; margin: 0 16px 16px; background: var(--dark); color: #fff; border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; box-shadow: 0 8px 20px rgba(0,0,0,.18); }
.dc-save div { display: flex; gap: 8px; }
.dc-save .dc-btn.ghost { background: transparent; color: #fff; border-color: #52525b; }
.dc-member { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.dc-member span:nth-child(2) { flex: 1 1 auto; font-weight: 500; }
.av { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #111; font-weight: 700; font-size: 13px; flex: none; }
.av.big { width: 52px; height: 52px; font-size: 20px; }
.dc-x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.dc-x:hover { background: var(--soft); color: var(--ink); }
.dc-add { display: flex; flex-wrap: wrap; gap: 8px; }
.dc-add select, .dc-add input { flex: 1 1 140px; min-width: 0; }
.dc-profile { display: flex; gap: 14px; align-items: center; padding: 20px 20px 4px; }
.dc-profile h2 { font-size: 20px; }
.dc-line { margin: 0; font-size: 13.5px; }
.rchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.rchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 3px 10px; font-size: 12.5px; }
.rchip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.guia { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.guia div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.guia b.n { width: 24px; height: 24px; border-radius: 50%; background: var(--dark); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; font-size: 12px; }
.alerts details.al { border: 0; padding: 0; }
.alerts details.al summary { color: #7f1d1d; font-weight: 500; }
.alerts details.al p { color: #7f1d1d; opacity: .85; margin: 4px 0 6px 16px; font-size: 12.5px; }
.kpi details { margin-top: 4px; }

/* Barra de teste do protótipo (não existe no site real) e partes geradas do menu */
.testbar { background: #fffbeb; border-bottom: 1px solid #fde68a; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tb-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #92400e; }
.tb-chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 400px; align-items: center; }
.tb-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #e7d9b5; background: #ffffff; border-radius: 99px; padding: 5px 12px; font-size: 13px; min-height: 32px; }
.tb-chip i { width: 10px; height: 10px; border-radius: 50%; }
.tb-chip[aria-pressed="true"] { background: var(--dark); color: #fff; border-color: var(--dark); }
.tb-sep { font-size: 12px; color: #92400e; margin-left: 6px; }
.tb-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tb-btn { border: 1px solid #e7d9b5; background: #ffffff; border-radius: 8px; padding: 5px 10px; font-size: 12.5px; min-height: 32px; }
.tb-btn[aria-pressed="true"] { background: #fde68a; }
.usercard { margin-top: auto; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding: 12px 6px 0; }
.usercard b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.usercard span:not(.av) { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.pk { text-align: left; background: var(--card); cursor: pointer; }
.tile.pk:hover { border-color: var(--dark); }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 560px; }
.tbl th { text-align: left; font-weight: 500; background: var(--soft); padding: 10px 14px; white-space: nowrap; }
.tbl td { padding: 11px 14px; border-top: 1px solid var(--line); }

.testbar { flex-direction: column; align-items: stretch; }
.tb-chips { flex-direction: column; align-items: stretch; flex: none; }
.tb-setor { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tb-seta { color: #b45309; font-size: 13px; }

const fmt = (v, c = 0) => v.toLocaleString('pt-BR', {minimumFractionDigits: c, maximumFractionDigits: c});
const brl = v => 'R$ ' + fmt(v);
const pct = (v, c = 1) => fmt(v * 100, c) + '%';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const maqs = e => (e === 'all' ? ORDEM : ORDEM.filter(k => e.split('+').includes(k)));
// Chave do escopo a partir de uma lista de máquinas: 'all', 'L3' ou 'L1+L3'
const chaveEscopo = lista => { const l = ['L1', 'L2', 'L3'].filter(k => lista.includes(k)); return l.length === 3 ? 'all' : l.join('+'); };
// Escopo com 2 máquinas: soma as contagens das duas e recalcula taxas e médias
[['L1', 'L2'], ['L1', 'L3'], ['L2', 'L3']].forEach(par => {
  const [a, b] = par.map(k => D[k]), soma = c => a[c] + b[c], media = c => [0, 1].map(i => (a[c][i] * a.registros + b[c][i] * b.registros) / (a.registros + b.registros));
  const d = {registros: soma('registros'), falhas: soma('falhas'), dias_falha: soma('dias_falha'), horas_teto: soma('horas_teto'), horas_piso: soma('horas_piso'),
    custo_teto: soma('custo_teto'), custo_piso: soma('custo_piso'), horas_possiveis: soma('horas_possiveis'), reg_abr: soma('reg_abr'), reg_mai: soma('reg_mai'),
    reincid: soma('reincid'), reincid_max: Math.max(a.reincid_max, b.reincid_max), conf: soma('conf'), duv: soma('duv'), erro: soma('erro'),
    cut: media('cut'), tq: media('tq'), rpm: media('rpm'), ct_alta: soma('ct_alta'), v_std: (a.v_std + b.v_std) / 2, hp_fora: soma('hp_fora')};
  d.taxa = d.falhas / d.registros; d.disp_teto = 1 - d.horas_teto / d.horas_possiveis; d.disp_piso = 1 - d.horas_piso / d.horas_possiveis; d.mtbf = d.horas_possiveis / d.falhas;
  d.taxa_abr = (a.taxa_abr * a.reg_abr + b.taxa_abr * b.reg_abr) / d.reg_abr; d.taxa_mai = (a.taxa_mai * a.reg_mai + b.taxa_mai * b.reg_mai) / d.reg_mai;
  D[par.join('+')] = d;
});

// Barras empilhadas por mês (uma cor por máquina)
function svgEmpilhado(e, valores, fmtTopo) {
  const ms = maqs(e), n = MES_LAB.length, tot = MES_LAB.map((_, i) => ms.reduce((a, k) => a + valores[k][i], 0));
  const max = Math.max(...tot), slot = 540 / n, bw = slot * .5;
  let g = '';
  MES_LAB.forEach((lab, i) => {
    let y = 200; const x = 50 + i * slot + (slot - bw) / 2;
    [...ms].reverse().forEach(k => { const h = valores[k][i] / max * 165; y -= h; g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${COR[k]}"></rect>`; });
    g += `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="#0a0a0a">${fmtTopo(tot[i])}</text>`;
    g += `<text x="${(x + bw / 2).toFixed(1)}" y="218" text-anchor="middle" font-size="11" fill="#52525b">${lab}</text>`;
  });
  return `<svg viewBox="0 0 600 228" role="img" aria-label="Barras por mês"><line x1="40" y1="200" x2="595" y2="200" stroke="#d4d4d8"></line>${g}</svg>`;
}
// Barras agrupadas de disponibilidade (60% a 100%) com a meta de 90%
function svgDisp(e) {
  const ms = maqs(e), slot = 540 / MES_LAB.length, bw = Math.min(16, slot * .7 / ms.length), y = v => 200 - (Math.max(60, v) - 60) / 40 * 175;
  let g = `<rect x="40" y="${y(90).toFixed(1)}" width="555" height="1.2" fill="#16a34a"></rect><text x="44" y="${(y(90) - 5).toFixed(1)}" text-anchor="start" font-size="11" fill="#166534">meta 90%</text>`;
  MES_LAB.forEach((lab, i) => {
    const x0 = 50 + i * slot + (slot - bw * ms.length - 3 * (ms.length - 1)) / 2;
    ms.forEach((k, j) => { const v = DISP_MES[k][i], yy = y(v); g += `<rect x="${(x0 + j * (bw + 3)).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${(200 - yy).toFixed(1)}" fill="${COR[k]}"><title>${M[k].nome} ${lab}: ${fmt(v, 1)}%</title></rect>`; });
    g += `<text x="${(50 + i * slot + slot / 2).toFixed(1)}" y="218" text-anchor="middle" font-size="11" fill="#52525b">${lab}</text>`;
  });
  return `<svg viewBox="0 0 600 228" role="img" aria-label="Disponibilidade por mês"><line x1="40" y1="200" x2="595" y2="200" stroke="#d4d4d8"></line><text x="34" y="29" text-anchor="end" font-size="11" fill="#52525b">100%</text><text x="34" y="204" text-anchor="end" font-size="11" fill="#52525b">60%</text>${g}</svg>`;
}
// Linhas semanais (jan a mai/2022)
function svgLinhas(e, serie, min, max, rotulo, limite) {
  const x = i => 50 + i * 27.2, y = v => 200 - (Math.min(max, Math.max(min, v)) - min) / (max - min) * 175;
  let g = '';
  if (limite) g += `<rect x="40" y="${y(limite).toFixed(1)}" width="555" height="${(200 - y(limite)).toFixed(1)}" fill="#fff7ed"></rect><line x1="40" y1="${y(limite).toFixed(1)}" x2="595" y2="${y(limite).toFixed(1)}" stroke="#ea580c" stroke-dasharray="5 4"></line><text x="590" y="194" text-anchor="end" font-size="11" fill="#9a3412">zona de alerta (abaixo de ${fmt(limite, 1)} bar)</text>`;
  maqs(e).forEach(k => { g += `<polyline points="${serie[k].map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ')}" fill="none" stroke="${COR[k]}" stroke-width="2.5" stroke-linejoin="round"></polyline>`; });
  SEM_MESES.forEach(([i, m]) => { g += `<text x="${x(i).toFixed(1)}" y="218" text-anchor="middle" font-size="11" fill="#52525b">${m}</text>`; });
  return `<svg viewBox="0 0 600 228" role="img" aria-label="Linhas semanais"><line x1="40" y1="25" x2="595" y2="25" stroke="#f4f4f5"></line><line x1="40" y1="200" x2="595" y2="200" stroke="#d4d4d8"></line><text x="34" y="29" text-anchor="end" font-size="11" fill="#52525b">${rotulo[1]}</text><text x="34" y="204" text-anchor="end" font-size="11" fill="#52525b">${rotulo[0]}</text>${g}</svg>`;
}

  const cs = v.startsWith('cargo:') ? [C(v.slice(6)), C('todos')] : cargosDe(MB(v));
  cs.forEach(c => c.itens.forEach(i => { out[i] = [...new Set([...(out[i] || []), ...c.maqs])]; }));

function poder(v) {

}

// O que dá para ligar num cargo: o que o pai dele tem (cargo de topo: tudo, só o dono mexe)
const limiteDe = c => (c.pai ? {itens:C(c.pai).itens, maqs:C(c.pai).maqs} : {itens:TODOS, maqs:TUDO});

// Regra "tirou de cima, sai de baixo": cada cargo só pode ter o que o pai tem, descendo a árvore inteira
function cascata() {
  const perdas = [];

    const pai = C(id), pi = c.itens.filter(x => !pai.itens.includes(x)), pm = c.maqs.filter(x => !pai.maqs.includes(x));
    if (pi.length || pm.length) {
      c.itens = c.itens.filter(x => pai.itens.includes(x)); c.maqs = c.maqs.filter(x => pai.maqs.includes(x));
      perdas.push(`${c.nome} perdeu ${[pi.length ? plural(pi.length) : '', pm.length ? pm.map(k => M[k].nome).join(', ') : ''].filter(Boolean).join(' e ')}`);
    }
    desce(c.id);
  });
  S.cargos.filter(c => !c.pai).forEach(c => desce(c.id));

}

const INTENCOES = [
  {id:'custo', q:'Quanto perdi com paradas?', re:/(custo|perd|gast|dinheiro|r\$|preju)/i, precisa:['fin_custo'],
   r:(ac) => { const e = ac.fin_custo, v = ITEM('fin_custo').val(e); return `As paradas custaram entre <b>${v.v.replace(' a ', ' e ')}</b> (${ESCOPO[e].toLowerCase()}). A faixa existe porque o dataset não diz se várias falhas no mesmo dia são uma parada só.`; }},
  {id:'risco', q:'Qual máquina tem mais risco?', re:/(risco|vai parar|vai quebrar|prioridade|pior m)/i, precisa:['prev_chance', 'fin_risco'], algum:true,
   r:(ac) => { const e = ac.prev_chance || ac.fin_risco, k = maqs(e)[0], partes = [ac.prev_chance ? `${pct(M[k].chance)} de chance de falha` : '', ac.fin_risco ? `risco de <b>${brl(M[k].risco)} por dia</b>` : ''].filter(Boolean); return `${maqs(e).length > 1 ? 'A máquina com mais risco é a' : 'A sua máquina, a'} <b>${M[k].nome}</b>: ${partes.join(', ')}.`; }},
  {id:'prox', q:'Quando vem a próxima falha?', re:/(quando|próxima|proxima|horas)/i, precisa:['prev_proxima'],
   r:(ac) => maqs(ac.prev_proxima).map(k => `<b>${M[k].nome}</b>: ~${fmt(M[k].prox, 1)} h`).join(' · ') + '. É uma média do ritmo recente, não um horário exato.'},
  {id:'alerta', q:'Tem algum alerta agora?', re:/(alerta|sensor|press|hidr)/i, precisa:['man_alertas'],
   r:(ac) => maqs(ac.man_alertas).map(k => `<b>${M[k].nome}</b>: pressão hidráulica baixa em ${M[k].hp} dos últimos 30 registros`).join(' · ') + '. Abaixo de 101,7 bar o alerta dispara.'},
  {id:'tarefas', q:'Quais são as minhas tarefas?', re:/(tarefa|fazer|ação|acao|plano|primeiro)/i, precisa:[],
   r:() => { const l = comigo(vendo); return l.length ? l.map(t => `<b>${esc(t.titulo)}</b> (até ${t.prazo}, ${t.status})`).join(' · ') : 'Você não tem tarefas agora.'; }},
  {id:'dados', q:'Alguma máquina está sem enviar dados?', re:/(sem dados|enviando|leitura|conex)/i, precisa:['man_semdados'],
   r:(ac) => maqs(ac.man_semdados).map(k => `<b>${M[k].nome}</b>: ${M[k].semdados ? M[k].semdados + ' dias sem dados' : 'em dia'}`).join(' · ') + '.'},
  {id:'disp', q:'Como está a disponibilidade?', re:/(disponib|oee|funcionando)/i, precisa:['op_disp'],
   r:(ac) => `A disponibilidade está entre <b>${ITEM('op_disp').val(ac.op_disp).v.replace(' a ', ' e ')}</b> (${ESCOPO[ac.op_disp].toLowerCase()}), para uma meta de 90%.`}
];
function quemLibera(itemId) {
  const meus = meusCargos(vendo);
  const acima = [...new Set(meus.flatMap(ancestrais))].filter(id => C(id).itens.includes(itemId) && C(id).repassa);
  const pessoas = S.membros.filter(m => !m.dono && m.cargos.some(id => acima.includes(id))).map(m => m.nome);
  return [...pessoas, 'Você (dono)'].slice(0, 3).join(', ');
}
function responder(pergunta) {
  const ac = acesso(vendo), it = INTENCOES.find(x => x.re.test(pergunta));
  if (!it) return {txt:'Não encontrei essa informação nos blocos da sua tela. Tente uma das sugestões abaixo.', fontes:[]};
  const falta = it.precisa.filter(i => !(i in ac));
  if (it.precisa.length && (it.algum ? falta.length === it.precisa.length : falta.length)) return {negado:true, txt:`Essa informação não foi liberada para você (${falta.map(i => ITEM(i).nome).join(', ')}). Quem pode liberar: <b>${esc(quemLibera(falta[0]))}</b>.`, fontes:[]};
  return {txt: it.r(ac), fontes: it.id === 'tarefas' ? ['Tarefas'] : it.precisa.filter(i => i in ac).map(i => ITEM(i).nome)};
}
function telaCopiloto() {
  return `<div class="title"><h1>Copiloto IA</h1><p>Respondendo como <b>${esc(nomeVendo(vendo))}</b>. Simulação: no app, o DeepSeek escreve a resposta, mas só com os números dos blocos liberados. Ele nunca calcula.</p></div>
  <section class="box"><div class="chat">${chat.length ? chat.map(m => m.de === 'user' ? `<div class="msg user">${esc(m.txt)}</div>` : `<div class="msg bot${m.negado ? ' denied' : ''}"><span>${m.txt}</span>${m.fontes.length ? `<div class="src">${m.fontes.map(f => `<span>Fonte: ${f}</span>`).join('')}</div>` : ''}</div>`).join('') : '<p class="hint">Faça uma pergunta. Se a informação não foi liberada, o copiloto não responde e diz quem pode liberar.</p>'}</div>
    <div class="chips">${INTENCOES.map(x => `<button class="chip" type="button" data-perg="${x.id}">${x.q}</button>`).join('')}</div>
    <form id="ask" class="ask" novalidate><input id="ask-in" placeholder="Pergunte sobre as suas máquinas" autocomplete="off" aria-label="Pergunta"><button class="btn primary" type="submit">Enviar</button></form></section>`;
}
function perguntar(txt) { chat.push({de:'user', txt}); chat.push(Object.assign({de:'bot'}, responder(txt))); render(); }

function telaCardapio() {
  return `<div class="title"><h1>Cardápio de informações</h1><p>Tudo o que pode ser liberado por cargo: ${ITENS.length} informações em 8 pacotes. Cada uma explica de onde vem, a conta e o porquê. Valores das 3 máquinas juntas.</p></div>
  <div class="legend"><span><span class="pill ok">Dados atuais</span> calculado direto dos dados</span><span><span class="pill prem">Com premissa</span> usa uma premissa com fonte</span><span><span class="pill novo">Dado novo</span> a fábrica ainda não envia</span></div>
  ${PACOTES.map(pk => { const l = ITENS.filter(i => i.pac === pk.id); return `<section class="box"><div class="box-head"><h2>${pk.nome}</h2><p>${l.length} informações</p></div><div class="tiles">${l.map(i => { const r = i.val('all'); return `<article class="tile"><div class="tile-top"><b>${i.nome}</b><span class="pill ${i.st}">${PILL[i.st]}</span></div><div class="v">${r.v}</div><div class="s">${r.sub}</div>${como(i, r, true)}</article>`; }).join('')}</div></section>`; }).join('')}`;
}
function telaComo() {
  const passo = (t, x) => `<div class="box"><h2>${t}</h2><p>${x}</p></div>`;
  return `<div class="title"><h1>Como funciona</h1><p>O site não tem um painel fixo: ele monta a tela de cada pessoa com o que os cargos dela liberam.</p></div>
  <div class="steps">${passo('1. O dono cria os setores', 'Cada setor começa com um cargo de topo (ex.: Gerência, Financeiro), com as informações e máquinas daquele setor.')}${passo('2. Cada chefe monta a sua equipe', 'Quem tem um cargo que pode repassar cria cargos abaixo dele, dá esses cargos às pessoas e delega tarefas, sempre só com o que tem.')}${passo('3. A cadeia desce até o fim', 'O penúltimo nível ainda repassa para o último. Só o último nível fica sem repassar: ele executa.')}${passo('4. O site monta a tela', 'Cada pessoa vê só os blocos, gráficos e tarefas que recebeu. O copiloto responde só com isso.')}</div>
  <section class="box"><h2>As regras</h2><ol style="margin:0;padding-left:20px;display:grid;gap:4px"><li>Cada cargo fica abaixo de um cargo pai. O dono fica acima de todos.</li><li>Só dou o que tenho: um cargo só pode ter as informações e máquinas do cargo de cima.</li><li>Tirou de cima, sai de baixo: se o cargo de cima perde algo, todos abaixo perdem também.</li><li>Cada chefe só mexe nos cargos abaixo do seu, nunca nos de outro setor.</li><li>Tarefas descem pela cadeia: só delega quem está com a tarefa, para um cargo abaixo que veja a informação da tarefa.</li><li>Quem tem vários cargos vê a soma, cada informação só das máquinas que o cargo libera.</li><li>Tudo fica registrado. A IA nunca dá acesso sozinha.</li></ol></section>
  <section class="box"><h2>Por que dá para confiar nos números</h2><p>Todos os números saem de um programa fixo e testado. O copiloto (o DeepSeek do app) só lê os blocos liberados: ele nunca calcula e nunca vê o que não foi liberado. O dataset está sujo: 1.186 falhas são confirmadas pelos sensores, 68 são duvidosas e 11 têm erro de dado. Como ele não tem a hora de cada registro, custo, horas paradas e disponibilidade aparecem como faixa: o piso conta no máximo uma parada por dia por máquina e o teto conta cada registro como uma parada.</p></section>`;
}

// ---------------------------------------------------------------- eventos
const sujo = () => rascunho && JSON.stringify(rascunho) !== JSON.stringify(C(rascunho.id));
const editar = () => { if (!rascunho || rascunho.id !== cargoSel) rascunho = JSON.parse(JSON.stringify(C(cargoSel))); return rascunho; };
const bloqueado = () => { if (sujo()) { toast('Salve ou desfaça as mudanças do cargo antes de sair dele.'); return true; } return false; };
function novoCargo(pai) {
  const id = 'c' + Date.now().toString(36), base = pai ? C(pai) : null;
  S.cargos.push({id, pai, nome: pai ? `abaixo de ${base.nome}` : 'novo setor', cor:'#95a5a6', itens:[], maqs: base ? [...base.maqs] : [...TUDO], repassa:true});
  cargoSel = id; aba = 'perm'; rascunho = null; salvar(); render();
  toast(pai ? 'Cargo criado abaixo. Ligue o que ele vê (só o que o cargo de cima tem) e salve.' : 'Setor criado no topo. Ligue o que ele vê e salve.');
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.view) { if (bloqueado()) return; view = d.view; rascunho = null; render(); return; }
  if (d.ver) { if (bloqueado()) return; vendo = d.ver; view = 'visao'; chat = []; rascunho = null; render(); window.scrollTo(0, 0); return; }
  if (d.cargo) { if (d.cargo !== cargoSel && bloqueado()) return; cargoSel = d.cargo; rascunho = null; render(); return; }
  if (d.aba) { aba = d.aba; render(); return; }
  if (d.membro) { membroSel = d.membro; render(); return; }
  if (d.vercargo) { if (bloqueado()) return; vendo = 'cargo:' + d.vercargo; view = 'visao'; chat = []; rascunho = null; render(); window.scrollTo(0, 0); return; }
  if (d.vermembro) { vendo = d.vermembro; view = 'visao'; chat = []; render(); window.scrollTo(0, 0); return; }
  if (d.perg) { perguntar(INTENCOES.find(x => x.id === d.perg).q); return; }
  if (d.sw) {
    const r = editar();
    if (d.sw === 'repassa') r.repassa = !r.repassa;
    else if (d.sw.startsWith('maq:')) { const k = d.sw.slice(4); r.maqs = r.maqs.includes(k) ? r.maqs.filter(x => x !== k) : [...r.maqs, k]; }
    else r.itens = r.itens.includes(d.sw) ? r.itens.filter(x => x !== d.sw) : [...r.itens, d.sw];
    render(); return;
  }
  if (d.cor) { editar().cor = d.cor; render(); return; }
  if (d.tirar) { const m = MB(d.tirar); m.cargos = m.cargos.filter(x => x !== cargoSel); salvar(); render(); toast(`${m.nome} saiu do cargo.`); return; }
  if (d.tirarcargo) { const m = MB(membroSel), nome = C(d.tirarcargo).nome; m.cargos = m.cargos.filter(x => x !== d.tirarcargo); salvar(); render(); toast(`${m.nome} perdeu o cargo ${nome}.`); return; }
  if (d.delegar) {
    const tf = S.tarefas.find(x => x.id === d.delegar), dest = document.querySelector(`[data-dest="${tf.id}"]`).value;
    if (!destinos(vendo, tf).includes(dest)) { toast('Você só delega para um cargo abaixo que veja a informação da tarefa.'); return; }
    tf.cargo = dest; tf.cadeia.push(dest); salvar(); render(); toast(`Tarefa delegada para ${C(dest).nome}.`); return;
  }
  switch (t.id) {
    case 'r-criar': if (!bloqueado()) novoCargo(cargoSel); return;
    case 'r-criar-topo': if (!bloqueado()) novoCargo(null); return;
    case 'r-salvar': {
      const i = S.cargos.findIndex(c => c.id === rascunho.id); if (rascunho.nome.trim() === '') { toast('Dê um nome ao cargo.'); return; }
      const lim = limiteDe(rascunho); rascunho.itens = rascunho.itens.filter(x => lim.itens.includes(x)); rascunho.maqs = rascunho.maqs.filter(x => lim.maqs.includes(x));
      S.cargos[i] = rascunho; rascunho = null; const perdas = cascata(); salvar(); render();
      toast(perdas.length ? `Salvo. Em cascata: ${perdas.join('; ')}.` : 'Cargo salvo.'); return;
    }
    case 'r-reset': rascunho = null; render(); return;
    case 'r-excluir': {
      // os cargos de baixo sobem para o pai do cargo excluído e se ajustam ao que ele tem
      const c = C(cargoSel); filhosC(c.id).forEach(f => { f.pai = c.pai; });
      S.cargos = S.cargos.filter(x => x.id !== c.id); S.membros.forEach(m => { m.cargos = m.cargos.filter(x => x !== c.id); });
      S.tarefas.forEach(tf => { if (tf.cargo === c.id) tf.cargo = c.pai || tf.cadeia[0]; });
      cargoSel = c.pai || S.cargos[0].id; rascunho = null; const perdas = cascata(); salvar(); render(); toast(`Cargo ${c.nome} excluído. Quem estava abaixo subiu um nível.${perdas.length ? ' ' + perdas.join('; ') + '.' : ''}`); return;
    }
    case 'r-addbtn': { const m = MB(document.getElementById('r-add').value); m.cargos.push(cargoSel); salvar(); render(); toast(`${m.nome} recebeu o cargo ${C(cargoSel).nome}.`); return; }
    case 'm-darcargo': { const m = MB(membroSel), id = document.getElementById('m-cargo').value; m.cargos.push(id); salvar(); render(); toast(`${m.nome} recebeu o cargo ${C(id).nome}.`); return; }
    case 'm-remover': { const m = MB(membroSel); S.membros = S.membros.filter(x => x.id !== m.id); membroSel = 'm0'; salvar(); render(); toast(`${m.nome} saiu da empresa.`); return; }
    case 'reset': S = EXEMPLO(); vendo = 'm0'; view = 'visao'; cargoSel = 'g1'; rascunho = null; chat = []; salvar(); render(); toast('Exemplo restaurado.'); return;
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'r-nome') { editar().nome = ev.target.value; if (!document.querySelector('.dc-save')) { const p = ev.target.selectionStart; render(); const el = document.getElementById('r-nome'); el.focus(); el.setSelectionRange(p, p); } }
  if (ev.target.id === 'r-busca') { busca = ev.target.value; const p = ev.target.selectionStart; render(); const el = document.getElementById('r-busca'); el.focus(); el.setSelectionRange(p, p); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'tb-pessoa') { if (bloqueado()) { t.value = ''; return; } if (t.value) { vendo = t.value; view = 'visao'; chat = []; rascunho = null; render(); window.scrollTo(0, 0); } return; }
  if (t.dataset.status) { const tf = S.tarefas.find(x => x.id === t.dataset.status); tf.status = t.value; salvar(); render(); toast(`Status: ${t.value}.`); }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'ask') { const q = document.getElementById('ask-in').value.trim(); if (q) perguntar(q); return; }
  if (ev.target.id === 'm-novo') {
    const nome = document.getElementById('m-nome').value.trim(); if (!nome) { toast('Escreva o nome de quem vai entrar.'); return; }
    const id = 'm' + Date.now().toString(36); S.membros.push({id, nome, cargos:[]}); membroSel = id; salvar(); render(); toast(`${nome} entrou na empresa, ainda sem cargo. Dê um cargo da sua área.`); return;
  }
  if (ev.target.id === 't-nova') {
    const titulo = document.getElementById('t-titulo').value.trim(), cargo = document.getElementById('t-cargo').value, item = document.getElementById('t-item').value, prazo = document.getElementById('t-prazo').value.trim() || 'sem prazo';
    if (!titulo) { toast('Escreva o que precisa ser feito.'); return; }
    if (!C(cargo).itens.includes(item)) { toast(`${C(cargo).nome} não vê "${ITEM(item).nome}". Escolha outra informação ou outro cargo.`); return; }
    S.tarefas.push({id:'t' + Date.now().toString(36), titulo, item, prazo, status:'a fazer', cargo, cadeia:[...ancestrais(cargo).reverse().filter(id => poder(vendo).dono || poder(vendo).gerencia.includes(id) || meusCargos(vendo).includes(id)), cargo]});
    salvar(); render(); toast(`Tarefa criada para ${C(cargo).nome}.`);
  }
});
// ---------------------------------------------------------------- páginas do site gerado (o menu e as telas saem das permissões)
const corVendo = v => (v.startsWith('cargo:') ? C(v.slice(6)).cor : corDe(MB(v)));
const subVendo = v => (v.startsWith('cargo:') ? 'visualizando como cargo' : MB(v).dono ? 'Dono da empresa' : MB(v).cargos.map(id => C(id).nome).join(', ') || 'sem cargo');
const chipsVendo = v => (v.startsWith('cargo:') ? `<span class="rchip"><i style="background:${C(v.slice(6)).cor}"></i>${esc(C(v.slice(6)).nome)}</span>` : MB(v).dono ? '<span class="rchip"><i style="background:#f0b232"></i>Dono da empresa</span>' : MB(v).cargos.map(id => `<span class="rchip"><i style="background:${C(id).cor}"></i>${esc(C(id).nome)}</span>`).join('') || '<span class="rchip">sem cargo</span>');
const kpiHtml = (i, e) => { const r = i.val(e); return `<div class="kpi"><span class="l">${i.nome}</span><span class="v">${r.v}</span><span class="s">${r.sub}</span>${como(i, r)}</div>`; };
const grafHtml = (id, ac) => { const gr = GRAF[id], i = ITEM(id), e = ac[id], r = i.val(e); return `<section class="box chart"><div class="box-head"><div><h2>${gr.t}</h2><p>${gr.s} · ${ESCOPO[e]}</p></div><span class="pill ${i.st}">${PILL[i.st]}</span></div>${gr.g(e)}${como(i, r)}</section>`; };
const alertaHtml = (al, aberto) => `<section class="alerts" aria-label="Alertas"><b class="t">${al.length} ${al.length === 1 ? 'alerta' : 'alertas'}</b>${al.map(a => `<details class="al" ${aberto ? 'open' : ''}><summary>${a.t}</summary><p>${a.d}</p></details>`).join('')}</section>`;

// Colunas da Frota: cada coluna só aparece se a pessoa recebeu a informação daquela coluna
const COLS_FROTA = [
  ['prev_saude', 'Saúde', k => `<span style="color:${corSaude(M[k].saude)};font-weight:700">${M[k].saude}/100</span>`],
  ['prev_chance', 'Chance de falha', k => pct(M[k].chance)],
  ['prev_proxima', 'Próxima falha', k => `~${fmt(M[k].prox, 1)} h`],
  ['op_disp', 'Disponibilidade', k => `${pct(D[k].disp_teto)} a ${pct(D[k].disp_piso)}`],
  ['op_falhas', 'Falhas', k => fmt(D[k].falhas)],
  ['fin_risco', 'Risco por dia', k => brl(M[k].risco)],
  ['man_semdados', 'Última leitura', k => M[k].semdados > 7 ? `<span style="color:var(--red);font-weight:600">${M[k].ultima} · ${M[k].semdados} dias sem dados</span>` : M[k].ultima]
];
const ALERTA_ITENS = ['man_semdados', 'op_disp', 'prev_saude', 'man_alertas'];
const maqsDe = ac => ORDEM.filter(k => Object.values(ac).some(e => maqs(e).includes(k)));

function paginas(v) {
  const ac = acesso(v), tem = id => id in ac, p = poder(v);
  return {
    frota: COLS_FROTA.some(([id]) => tem(id)),
    alertas: ALERTA_ITENS.some(tem),
    pacotes: PACOTES.filter(pk => ITENS.some(i => i.pac === pk.id && tem(i.id))),
    admin: p.pode,
    tarefas: comigo(v).length > 0 || naEquipe(v).length > 0 || p.pode
  };
}

function telaVisao() {
  const ac = acesso(vendo), ids = Object.keys(ac), tem = id => id in ac, pg = paginas(vendo);
  let h = `<div class="title"><h1>Visão geral</h1><p>${vendo.startsWith('cargo:') ? `Vendo como o cargo <b>${esc(C(vendo.slice(6)).nome)}</b>` : `Olá, <b>${esc(nomeVendo(vendo))}</b>`}. Esta tela foi montada com as ${plural(ids.length)} que ${vendo.startsWith('cargo:') ? 'este cargo libera' : 'os seus cargos liberam'}.</p><div class="rchips">${chipsVendo(vendo)}</div></div>`;
  if (!ids.length) return h + '<div class="empty">Nenhum cargo liberou informações para você ainda. Quem gerencia os cargos precisa liberar alguma.</div>';
  const al = alertasDe(ac);
  if (al.length) h += alertaHtml(al.slice(0, 3)) + (al.length > 3 ? `<p class="hint">Mais ${al.length - 3} em Alertas.</p>` : '');
  h += `<div class="kpis">${DESTAQUE.filter(tem).slice(0, 6).map(id => kpiHtml(ITEM(id), ac[id])).join('')}</div>`;
  const gs = Object.keys(GRAF).filter(tem).slice(0, 2);
  if (gs.length) h += `<div class="charts">${gs.map(id => grafHtml(id, ac)).join('')}</div>`;
  const tf = comigo(vendo);
  if (tf.length) h += `<section class="box"><div class="box-head"><h2>Suas tarefas</h2><button type="button" class="btn" data-view="tarefas">Abrir tarefas</button></div><div class="tasks">${tf.slice(0, 3).map(t => `<div class="task-mini"><b>${esc(t.titulo)}</b><span class="hint">até ${t.prazo} · ${t.status}</span></div>`).join('')}</div></section>`;
  h += `<section class="box"><div class="box-head"><h2>Seus pacotes</h2><p>Cada pacote vira uma página no menu</p></div><div class="tiles">${pg.pacotes.map(pk => { const n = ITENS.filter(i => i.pac === pk.id && tem(i.id)).length; return `<button type="button" class="tile pk" data-view="pac:${pk.id}"><div class="tile-top"><b>${pk.nome}</b><span class="pill ok">${n} de ${ITENS.filter(i => i.pac === pk.id).length}</span></div><span class="s">${ITENS.filter(i => i.pac === pk.id && tem(i.id)).map(i => i.nome).join(' · ')}</span></button>`; }).join('')}</div></section>`;
  return h;
}

function telaPacote(pid) {
  const ac = acesso(vendo), pk = PACOTES.find(x => x.id === pid), l = ITENS.filter(i => i.pac === pid && i.id in ac);
  let h = `<div class="title"><h1>${pk.nome}</h1><p>${l.length} de ${ITENS.filter(i => i.pac === pid).length} informações deste pacote liberadas para <b>${esc(nomeVendo(vendo))}</b>.</p></div>`;
  h += `<div class="kpis">${l.slice(0, 4).map(i => kpiHtml(i, ac[i.id])).join('')}</div>`;
  const gs = Object.keys(GRAF).filter(id => l.some(i => i.id === id));
  if (gs.length) h += `<div class="charts">${gs.map(id => grafHtml(id, ac)).join('')}</div>`;
  h += `<section class="box"><div class="box-head"><h2>Todas as informações</h2><p>Abra "De onde vem e como é calculado" em cada uma</p></div><div class="tiles">${l.map(i => tile(i, ac[i.id])).join('')}</div></section>`;
  const fora = ITENS.filter(i => i.pac === pid && !(i.id in ac));
  if (fora.length) h += `<p class="hint">Não liberadas para você neste pacote: ${fora.map(i => i.nome).join(', ')}.</p>`;
  return h;
}

function telaFrota() {
  const ac = acesso(vendo), cols = COLS_FROTA.filter(([id]) => id in ac), ms = ORDEM.filter(k => cols.some(([id]) => maqs(ac[id]).includes(k)));
  const cel = (id, f, k) => (maqs(ac[id]).includes(k) ? f(k) : '<span class="hint">sem acesso</span>');
  return `<div class="title"><h1>Frota</h1><p>As máquinas que os seus cargos liberam, só com as colunas que você recebeu.</p></div>
  <section class="box"><div class="box-head"><h2>Máquinas</h2><p>${ms.length} ${ms.length === 1 ? 'máquina' : 'máquinas'}</p></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Máquina</th><th>Linha</th>${cols.map(([, t]) => `<th>${t}</th>`).join('')}</tr></thead>
    <tbody>${ms.map(k => `<tr><td><b>${M[k].nome}</b></td><td>Shopfloor-${k}</td>${cols.map(([id, , f]) => `<td>${cel(id, f, k)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <details><summary>De onde vêm estas colunas</summary><div class="how">${cols.map(([id, t]) => { const i = ITEM(id); return `<div><span>${t}</span>${i.origem} Conta: ${i.conta} Por quê: ${i.porque}</div>`; }).join('')}</div></details>
  </section>`;
}

function telaAlertas() {
  const ac = acesso(vendo), al = alertasDe(ac);
  return `<div class="title"><h1>Alertas</h1><p>Só os alertas das informações e máquinas que você recebeu. Cada um explica de onde vem.</p></div>
  ${al.length ? alertaHtml(al, true) : '<div class="empty">Nenhum alerta nas suas máquinas agora.</div>'}`;
}

function menu() {
  const pg = paginas(vendo), b = (v, t, tag) => `<button class="nav" type="button" data-view="${v}" aria-current="${view === v ? 'page' : 'false'}">${t}${tag ? ` <span class="tag new">${tag}</span>` : ''}</button>`;
  return `<div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg></div><div style="display:flex;flex-direction:column"><b>Telemetry OS</b><span style="font-size:12px;color:var(--muted)">Operations</span></div></div>
    <div class="navgrp"><span>Platform</span>${b('visao', 'Visão geral')}${pg.frota ? b('frota', 'Frota') : ''}${pg.alertas ? b('alertas', 'Alertas', alertasDe(acesso(vendo)).length || '') : ''}${pg.tarefas ? b('tarefas', 'Tarefas', comigo(vendo).length || '') : ''}${b('copiloto', 'Copiloto IA')}</div>
    ${pg.pacotes.length ? `<div class="navgrp"><span>Seus pacotes</span>${pg.pacotes.map(pk => b('pac:' + pk.id, pk.nome)).join('')}</div>` : ''}
    ${pg.admin ? `<div class="navgrp"><span>Sua equipe</span>${b('cargos', 'Cargos')}${b('membros', 'Membros')}</div>` : ''}
    <div class="usercard"><span class="av" style="background:${corVendo(vendo)}">${esc(nomeVendo(vendo).replace(/^o cargo /, '')[0])}</span><div style="min-width:0"><b>${esc(nomeVendo(vendo).replace(/^o cargo /, ''))}</b><span>${esc(subVendo(vendo))}</span></div></div>`;
}

function barraTeste() {
  const chip = (v, nome, cor, extra) => `<button type="button" class="tb-chip" data-ver="${v}" aria-pressed="${vendo === v}"><i style="background:${cor}"></i>${esc(nome)}${extra || ''}</button>`;
  // cada setor numa linha, do cargo de topo até o último nível
  const setores = S.cargos.filter(c => !c.pai && c.id !== 'todos').map(raiz => { const linha = []; const vai = (id, n) => { linha.push(chip('cargo:' + id, C(id).nome, C(id).cor, '')); filhosC(id).forEach(x => vai(x.id, n + 1)); }; vai(raiz.id, 0); return `<div class="tb-setor">${linha.join('<span class="tb-seta">→</span>')}</div>`; }).join('');
  return `<div class="tb-setor">${chip('m0', 'Dono', '#f0b232', ' 👑')}<label class="tb-sep" for="tb-pessoa">ou uma pessoa:</label><select id="tb-pessoa" class="tb-sel"><option value="">escolher…</option>${S.membros.filter(m => !m.dono).map(m => `<option value="${m.id}" ${vendo === m.id ? 'selected' : ''}>${esc(m.nome)} · ${esc(m.cargos.map(id => C(id).nome).join(', ') || 'sem cargo')}</option>`).join('')}</select></div>${setores}`;
}

// ---------------------------------------------------------------- render e eventos
const NOMES = {tarefas:'Tarefas', visao:'Visão geral', frota:'Frota', alertas:'Alertas', cargos:'Cargos', membros:'Membros', copiloto:'Copiloto IA', cardapio:'Cardápio de informações (só no protótipo)', como:'Como funciona (só no protótipo)'};
function permitido(v) {
  const pg = paginas(vendo);
  if (v.startsWith('pac:')) return pg.pacotes.some(pk => 'pac:' + pk.id === v);
  return {frota:pg.frota, alertas:pg.alertas, cargos:pg.admin, membros:pg.admin, tarefas:pg.tarefas}[v] ?? true;
}
function render() {
  if (!vendo.startsWith('cargo:') && !MB(vendo)) vendo = 'm0';
  if (vendo.startsWith('cargo:') && !C(vendo.slice(6))) vendo = 'm0';
  if (!permitido(view)) view = 'visao';
  document.getElementById('tb-chips').innerHTML = barraTeste();
  document.getElementById('side').innerHTML = menu();
  document.getElementById('crumb').textContent = view.startsWith('pac:') ? PACOTES.find(p => 'pac:' + p.id === view).nome : NOMES[view];
  document.querySelectorAll('.tb-tools [data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
  const pagina = view.startsWith('pac:') ? () => telaPacote(view.slice(4)) : ({tarefas:telaTarefas, visao:telaVisao, frota:telaFrota, alertas:telaAlertas, cargos:telaCargos, membros:telaMembros, copiloto:telaCopiloto, cardapio:telaCardapio, como:telaComo})[view];
  document.getElementById('view').innerHTML = pagina();
}
render();
</script>

</html>
