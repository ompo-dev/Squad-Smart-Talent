<svg xmlns="http://www.w3.org/2000/svg" width="760" height="502" font-family="Arial" font-size="14">
<rect width="100%" height="100%" fill="white"/><text x="16" y="30" font-size="18" font-weight="bold">Peso de cada sensor na chance de falha</text>
<text x="280" y="72" text-anchor="end">Pressão hidráulica (bar)</text><rect x="290" y="56" width="340.0" height="24" fill="#b5523b" rx="3"/><text x="638.0" y="72">-1,38</text>
<text x="280" y="106" text-anchor="end">Força de corte (kN)</text><rect x="290" y="90" width="225.7" height="24" fill="#2f6f4f" rx="3"/><text x="523.7" y="106">+0,92</text>
<text x="280" y="140" text-anchor="end">Torque (Nm)</text><rect x="290" y="124" width="218.8" height="24" fill="#b5523b" rx="3"/><text x="516.8" y="140">-0,89</text>
<text x="280" y="174" text-anchor="end">Rotação do fuso (RPM)</text><rect x="290" y="158" width="88.7" height="24" fill="#2f6f4f" rx="3"/><text x="386.7" y="174">+0,36</text>
<text x="280" y="208" text-anchor="end">Temperatura do refrigerante (°C)</text><rect x="290" y="192" width="60.9" height="24" fill="#2f6f4f" rx="3"/><text x="358.9" y="208">+0,25</text>
<text x="280" y="242" text-anchor="end">Pressão do refrigerante (bar)</text><rect x="290" y="226" width="51.2" height="24" fill="#2f6f4f" rx="3"/><text x="349.2" y="242">+0,21</text>
<text x="280" y="276" text-anchor="end">Tensão (V)</text><rect x="290" y="260" width="12.3" height="24" fill="#2f6f4f" rx="3"/><text x="310.3" y="276">+0,05</text>
<text x="280" y="310" text-anchor="end">Temperatura do rolamento do fuso (°C)</text><rect x="290" y="294" width="11.3" height="24" fill="#b5523b" rx="3"/><text x="309.3" y="310">-0,05</text>
<text x="280" y="344" text-anchor="end">Temperatura do óleo hidráulico (°C)</text><rect x="290" y="328" width="10.1" height="24" fill="#b5523b" rx="3"/><text x="308.1" y="344">-0,04</text>
<text x="280" y="378" text-anchor="end">Vibração do fuso (µm)</text><rect x="290" y="362" width="9.9" height="24" fill="#b5523b" rx="3"/><text x="307.9" y="378">-0,04</text>
<text x="280" y="412" text-anchor="end">Vibração da ferramenta (µm)</text><rect x="290" y="396" width="9.1" height="24" fill="#2f6f4f" rx="3"/><text x="307.1" y="412">+0,04</text>
<text x="280" y="446" text-anchor="end">Pressão do ar (bar)</text><rect x="290" y="430" width="0.7" height="24" fill="#2f6f4f" rx="3"/><text x="298.7" y="446">+0,00</text>
<text x="16" y="488" fill="#555">Verde: valor alto aumenta a chance de falha. Vermelho: valor baixo aumenta a chance de falha.</text>
</svg>