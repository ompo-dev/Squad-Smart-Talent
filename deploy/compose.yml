x-app: &app
  image: ${APP_IMAGE:?Set an immutable GHCR image digest}
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
  environment: &app-env
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    REDIS_URL: redis://redis:6379
    NEXT_TELEMETRY_DISABLED: '1'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes: [telemetry_pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U telemetry -d telemetry']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [telemetry_redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    profiles: [ops]
    restart: 'no'
    command: [npm, run, 'db:migrate']
  web:
    <<: *app
    command: [npm, run, start]
    environment:
      <<: *app-env
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public application URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      REALTIME_PUBLIC_URL: ${REALTIME_PUBLIC_URL:?Set the public WebSocket URL}
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(async r=>process.exit(r.ok&&(await r.json()).status==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 20s
  worker:
    <<: *app
    command: [npm, run, worker]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  realtime:
    <<: *app
    command: [npm, run, realtime]
    environment:
      <<: *app-env
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:?Set allowed browser origins}
    ports: ['127.0.0.1:${REALTIME_PORT:-3002}:3002']
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  telemetry_pg:
  telemetry_redis:
